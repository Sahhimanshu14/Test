[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "npm install -g pnpm@12.3.4",
  "pnpm install --frozen-lockfile"
]

[phases.build]
cmds = [
  "pnpm --filter @cdsprep/database run db:generate",
  "pnpm --filter @cdsprep/api... run build"
]

[start]
cmd = "node apps/api/dist/main.js"
