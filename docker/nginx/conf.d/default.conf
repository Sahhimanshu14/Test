# ==============================================================================
# CDSPrep — Production Nginx Edge Reverse Proxy & Ingress Router
#
# Topology:
#   Web Frontend: https://your-domain (and www.your-domain)
#   REST API:     https://api.your-domain
#
# Production Security:
#   - Strict HTTP -> HTTPS 301 Redirection
#   - HSTS (HTTP Strict Transport Security with preload)
#   - Secure Cookie Enforcement (Secure, HttpOnly, SameSite=Lax)
#   - Modern TLS 1.2 / TLS 1.3 Ciphers
#   - Rate Limiting (DDoS & Brute-Force Defense)
# ==============================================================================

# Upstream connection pools with HTTP/1.1 keepalive
upstream web_upstream {
    server web:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream api_upstream {
    server api:4000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ==============================================================================
# 1. HTTP Ingress (Port 80) — Automatic HTTPS Redirection
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name your-domain www.your-domain api.your-domain;

    # Allow Let's Encrypt / ACME challenge verification without redirect
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Health check for load balancers / cloud probes before TLS termination
    location /healthz {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Strict HTTPS redirect for all application traffic
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# 2. Web Frontend (Port 443) — https://your-domain
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name your-domain www.your-domain;

    # TLS Certificates (Mount your production certificates at these paths)
    ssl_certificate /etc/nginx/certs/live/your-domain/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/your-domain/privkey.pem;

    # Modern TLS Security Configuration (Mozilla Modern Guide)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_WEB:10m;
    ssl_session_tickets off;

    # Edge Security Headers & HSTS (Strict-Transport-Security)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Automatic Secure Cookie Enforcement
    proxy_cookie_flags ~ secure httponly samesite=lax;

    # Proxy Headers & Protocols
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_cache_bypass $http_upgrade;

    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Next.js Static Asset Caching
    location /_next/static/ {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /static/ {
        proxy_pass http://web_upstream;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Frontend Application SSR & Navigation
    location / {
        limit_req zone=general_limit burst=100 nodelay;
        proxy_pass http://web_upstream;
    }
}

# ==============================================================================
# 3. REST API (Port 443) — https://api.your-domain
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.your-domain;

    # TLS Certificates
    ssl_certificate /etc/nginx/certs/live/api.your-domain/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/api.your-domain/privkey.pem;

    # Modern TLS Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL_API:10m;
    ssl_session_tickets off;

    # Edge Security Headers & HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Automatic Secure Cookie Enforcement
    proxy_cookie_flags ~ secure httponly samesite=lax;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-ID $request_id;

    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Unthrottled Edge Health Probes
    location = /health {
        proxy_pass http://api_upstream/health;
        access_log off;
    }

    location = /ready {
        proxy_pass http://api_upstream/ready;
        access_log off;
    }

    location = /api/health {
        proxy_pass http://api_upstream/health;
        access_log off;
    }

    location = /api/ready {
        proxy_pass http://api_upstream/ready;
        access_log off;
    }

    # Rate-Limiting Protection for Authentication Endpoints
    location ~* ^/api/v1/auth/(login|register|forgot-password|reset-password) {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://api_upstream;
    }

    # Core REST API Routing
    location / {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://api_upstream;
    }
}
